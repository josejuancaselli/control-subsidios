name: Deploy a Firebase

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy (hosting + reglas de Firestore)
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SA" ]; then echo "::error::Falta el secreto FIREBASE_SERVICE_ACCOUNT"; exit 1; fi
          echo "$FIREBASE_SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          set +e
          npx --yes firebase-tools@13 deploy --only hosting,firestore:rules --project control-subsidios --non-interactive > "$RUNNER_TEMP/out.txt" 2>&1
          code=$?
          cat "$RUNNER_TEMP/out.txt"
          if [ $code -ne 0 ]; then
            msg=$(grep -v "npm warn" "$RUNNER_TEMP/out.txt" | sed "s/\x1b\[[0-9;]*m//g" | tail -n 14 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Fallo el deploy::$msg"
          fi
          exit $code
